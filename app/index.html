<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#03040A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PakSoc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>UNSW PakSoc</title>
    <meta name="description" content="The official UNSW Pakistani Society app — see upcoming event details, locations and access links, plus all our social media in one place." />
    <meta property="og:title" content="UNSW PakSoc" />
    <meta property="og:description" content="See upcoming PakSoc event details, locations and access links, plus all our social media in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Instant dark shell before JS/CSS arrive -->
    <style>
      html { background: radial-gradient(58vw 55vh at 88% -8%, rgba(34,197,94,0.13), transparent 68%) no-repeat #03040A; }
      html, body, #root { margin: 0; min-height: 100%; color: #F8FAFC; }

      /* Boot splash — covers the JS-parse/mount gap with an ambient wordmark
         instead of a blank frame. main.tsx fades + removes it after first paint. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(58vw 55vh at 10% -8%, rgba(34,197,94,0.13), transparent 68%) no-repeat,
          radial-gradient(58vw 55vh at 90% -8%, rgba(139,92,246,0.13), transparent 68%) no-repeat #03040A;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #app-loader.app-loader-hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader-aurora {
        position: absolute;
        left: 50%;
        top: -8%;
        width: 130vw;
        height: 65vh;
        min-width: 640px;
        transform: translateX(-51%);
        background:
          radial-gradient(38% 55% at 28% 42%, rgba(34,197,94,0.20), transparent 70%),
          radial-gradient(34% 50% at 74% 48%, rgba(139,92,246,0.16), transparent 70%);
        animation: app-loader-drift 5s ease-in-out infinite alternate;
      }
      #app-loader-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        animation: app-loader-enter 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #app-loader-word {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1.55rem, 7.2vw, 2.25rem);
        letter-spacing: -0.01em;
        white-space: nowrap;
        background: linear-gradient(100deg, #64748B 15%, #F8FAFC 35%, #BBF7D0 48%, #F8FAFC 61%, #64748B 85%);
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: app-loader-shimmer 2s ease-in-out infinite;
      }
      #app-loader-sub {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #22C55E;
        opacity: 0.85;
      }
      @keyframes app-loader-drift {
        0%   { transform: translateX(-52%) translateY(0) scale(1);    }
        100% { transform: translateX(-48%) translateY(2%) scale(1.08); }
      }
      @keyframes app-loader-enter {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
      @keyframes app-loader-shimmer {
        0%   { background-position: 130% 0; }
        100% { background-position: -30% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader-aurora, #app-loader-word, #app-loader-content { animation: none; }
        #app-loader-word { -webkit-text-fill-color: #F8FAFC; color: #F8FAFC; }
        #app-loader { transition: opacity 0.12s linear; }
      }

      /* ─── Native-style portrait lock ────────────────────────────────────────
         iOS has NO orientation lock for web apps — it ignores the manifest
         `orientation` field and the Screen Orientation API, in Safari and in the
         installed PWA alike. So instead of letting the UI reflow into landscape
         (or nagging the user to rotate back), we counter-rotate the entire app
         90° whenever a phone is held sideways. The result stays visually upright
         and never changes layout — exactly like a native app that ignores
         rotation. Direction (cw/ccw) is chosen by JS on <html> from the device
         angle, so it's never upside-down. Scoped to phone-sized landscape (short
         viewport); tablets and desktop, where landscape is legitimate, are never
         rotated. */
      @media screen and (orientation: landscape) and (max-height: 500px) {
        html.rot-lock #root {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vh;  /* visual portrait WIDTH  = physical viewport height */
          height: 100vw; /* visual portrait HEIGHT = physical viewport width  */
          overflow: hidden;
          transform-origin: top left;
          /* iOS repaint glitches on transformed fixed layers without this hint */
          will-change: transform;
        }
        html.rot-cw  #root { transform: translateX(100vw) rotate(90deg);  }
        html.rot-ccw #root { transform: translateY(100vh) rotate(-90deg); }

        /* `dvh`/`vh` still measure the PHYSICAL (short) viewport height even
           inside the rotated frame — transforms don't change what viewport units
           mean — so full-height shells would come up short. Remap them to the
           rotated frame's real height, which equals the physical viewport WIDTH
           (100vw). Covers the home shell plus every `[100dvh]` full-height page
           (AuroraPage, events/roles/tasks managers, login). */
        html.rot-lock .home-appshell {
          height: calc(100vw + env(safe-area-inset-bottom, 0px)) !important;
        }
        html.rot-lock [class*="[100dvh]"] {
          height: 100vw !important;
          min-height: 100vw !important;
        }
      }
    </style>

    <!-- Portrait lock: tag <html> with the rotation direction from the device
         angle so the CSS above can counter-rotate a sideways phone. Runs before
         the app so the very first paint is already upright. See the `.rot-*`
         rules in the <style> block for the actual transforms. -->
    <script>
      (function () {
        var root = document.documentElement
        function apply() {
          var o = (typeof screen !== 'undefined' && screen.orientation) || null
          var angle = o && typeof o.angle === 'number' ? o.angle
            : typeof window.orientation === 'number' ? window.orientation : 0
          var type = (o && o.type) || ''
          // Phone-in-landscape only; the short side must be small enough that
          // this is a phone (matches the CSS `max-height: 500px` gate).
          var landscape = type ? type.indexOf('landscape') === 0
            : Math.abs(angle) === 90
          var phone = Math.min(window.innerWidth, window.innerHeight) <= 500
          var lock = landscape && phone
          root.classList.toggle('rot-lock', lock)
          // angle 90 / landscape-primary → rotate content counter-clockwise;
          // angle 270 (or -90) / landscape-secondary → clockwise.
          var ccw = angle === 90 || type === 'landscape-primary'
          root.classList.toggle('rot-ccw', lock && ccw)
          root.classList.toggle('rot-cw', lock && !ccw)
        }
        apply()
        if (typeof screen !== 'undefined' && screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener('change', apply)
        } else {
          window.addEventListener('orientationchange', apply)
        }
        window.addEventListener('resize', apply)
      })()
    </script>

    <!-- Events API starts HERE — before React, fonts, or any other asset -->

  <body>
    <div id="root"></div>
    <div id="app-loader" aria-hidden="true">

      <div id="app-loader-content">
