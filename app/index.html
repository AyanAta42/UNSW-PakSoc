<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PakSoc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PakSoc UNSW</title>

    <style>
      html,body{background:#050505;margin:0;min-height:100%;color:#F8FAFC;font-family:system-ui,sans-serif}
      #boot-shell{min-height:100vh}
      #boot-shell .nav{height:56px;display:flex;align-items:center;padding:0 16px;gap:10px}
      #boot-shell .logo{width:36px;height:36px;border-radius:999px;background:#111;border:1px solid #1C1C1C;flex-shrink:0}
      #boot-shell .brand{font-weight:700;font-size:14px;line-height:1.2}
      #boot-shell .sub{color:#22C55E;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
      #boot-shell .wrap{padding:16px;max-width:1400px;margin:0 auto}
      #boot-shell .hero{border:1px solid #1C1C1C;border-radius:18px;padding:20px;background:linear-gradient(135deg,#07140c 0%,#050505 55%,#0a0a0a 100%);min-height:200px}
      #boot-shell .hero h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.02em}
      #boot-shell .hero h1 span{color:#22C55E}
      #boot-shell .ename{margin:28px 0 14px;font-size:15px;font-weight:800;min-height:1.2em}
      #boot-shell .ename.pending{color:#64748B;font-weight:600}
      #boot-shell .cd{display:flex;gap:10px;flex-wrap:wrap}
      #boot-shell .cd > div{min-width:54px;text-align:center;padding:8px 10px;border-radius:14px;background:rgba(10,10,10,.92);border:1px solid #1C1C1C}
      #boot-shell .cd b{display:block;color:#4ADE80;font-size:24px;font-variant-numeric:tabular-nums;line-height:1;min-height:1em}
      #boot-shell .cd b.sk{background:linear-gradient(90deg,#0A0A0A,#1a1a1a,#0A0A0A);background-size:200% 100%;animation:bootShimmer 1.1s linear infinite;border-radius:6px;color:transparent}
      #boot-shell .cd i{display:block;margin-top:6px;font-style:normal;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#CBD5E1}
      #boot-shell .sec{margin-top:20px}
      #boot-shell .sec h2{margin:0 0 14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#94A3B8}
      #boot-shell .grid{display:grid;grid-template-columns:1fr;gap:16px}
      @media(min-width:768px){#boot-shell .grid{grid-template-columns:repeat(3,1fr)}#boot-shell .hero h1{font-size:40px}#boot-shell .cd > div{min-width:66px}#boot-shell .cd b{font-size:30px}}
      #boot-shell .card{background:#0A0A0A;border:1px solid #1C1C1C;border-radius:18px;overflow:hidden}
      #boot-shell .poster{height:120px;background:#121812}
      #boot-shell .body{padding:12px 16px 16px}
      #boot-shell .t{font-size:14px;font-weight:700;margin:0 0 6px}
      #boot-shell .m{font-size:11px;color:#94A3B8;margin:0}
      #boot-shell .sk{height:120px;background:linear-gradient(90deg,#0A0A0A,#151515,#0A0A0A);background-size:200% 100%;animation:bootShimmer 1.2s linear infinite}
      @keyframes bootShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>

    <!-- EVENTS_BOOT -->
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div class="nav">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <div class="brand">PakSoc UNSW</div>
            <div class="sub">Pakistani Society</div>
          </div>
        </div>
        <div class="wrap">
          <div class="hero">
            <h1>Next <span>Event</span></h1>
            <div class="ename pending" id="boot-name">Loading event…</div>
            <div class="cd" aria-live="off" id="boot-cd" data-ready="0">
              <div><b id="boot-d" class="sk">&nbsp;</b><i>days</i></div>
              <div><b id="boot-h" class="sk">&nbsp;</b><i>hrs</i></div>
              <div><b id="boot-m" class="sk">&nbsp;</b><i>mins</i></div>
              <div><b id="boot-s" class="sk">&nbsp;</b><i>secs</i></div>
            </div>
          </div>
          <div class="sec">
            <h2>Events</h2>
            <div class="grid" id="boot-events">
              <div class="card"><div class="sk"></div><div class="body"><p class="t">&nbsp;</p><p class="m">&nbsp;</p></div></div>
              <div class="card"><div class="sk"></div><div class="body"><p class="t">&nbsp;</p><p class="m">&nbsp;</p></div></div>
              <div class="card"><div class="sk"></div><div class="body"><p class="t">&nbsp;</p><p class="m">&nbsp;</p></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--APP_LOADER-->
    <!--BOOT_UI-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
