<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#030408" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PakSoc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PakSoc UNSW Web App</title>
    <meta name="description" content="The official UNSW Pakistani Society web app — see upcoming event details, locations and access links, plus all our social media in one place." />
    <meta property="og:title" content="PakSoc UNSW Web App" />
    <meta property="og:description" content="See upcoming PakSoc event details, locations and access links, plus all our social media in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Instant dark shell before JS/CSS arrive -->
    <style>
      html { background: radial-gradient(58vw 55vh at 10% -8%, rgba(34,197,94,0.13), transparent 68%) no-repeat, radial-gradient(58vw 55vh at 90% -8%, rgba(139,92,246,0.13), transparent 68%) no-repeat #030408; }
      html, body, #root { margin: 0; min-height: 100%; color: #F8FAFC; }
    </style>

    <!-- Events API starts HERE — before React, fonts, or any other asset -->
    <!-- EVENTS_BOOT -->

    <!-- Fonts: Satoshi (body/UI) + Cormorant Garamond italic (hero headline) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
